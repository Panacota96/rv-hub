name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0. Leave empty to build a test package."
        required: false

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  windows:
    needs: release-please
    if: always() && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
      SIGN_ENABLED: ${{ secrets.SIGN_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.sha }}
      - name: Rust toolchain pinned in rust-toolchain.toml (the release compiler is recorded in environment.json)
        run: rustup toolchain install && rustc --version
      - name: Build (static CRT, see .cargo/config.toml)
        run: cargo build --release --locked -p rv-hub-cli -p rv-hub-gui
      - name: Code signing of the executables (runs only when the SIGN_PFX_BASE64 secret exists)
        if: env.SIGN_ENABLED == 'true'
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          # OV/EV certificate as base64 PFX in repository secrets. Alternative for the French entity:
          # Azure Artifact Signing (azure/artifact-signing-action) instead of this step.
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          Get-ChildItem target\release\rv-hub.exe, target\release\rv-hub-gui.exe | ForEach-Object {
            & $signtool.FullName sign /f $pfx /p $env:SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Remove-Item $pfx
      - name: Verify the build before packaging
        shell: pwsh
        run: |
          .\target\release\rv-hub.exe self-test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\examples\sample\run.ps1 -Bin .\target\release\rv-hub.exe
      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Portable zip
        shell: pwsh
        run: |
          $name = "rv-hub-${{ steps.v.outputs.version }}-windows-x64"
          New-Item -ItemType Directory -Force dist\$name | Out-Null
          Copy-Item target\release\rv-hub.exe, target\release\rv-hub-gui.exe, README.md, LICENSE, NOTICE, CHANGELOG.md dist\$name
          Copy-Item -Recurse docs, examples dist\$name
          Remove-Item -Recurse -Force dist\$name\examples\sample\out -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\$name\* -DestinationPath dist\$name.zip
      - name: Installer (Inno Setup, preinstalled on windows-latest)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.v.outputs.version }} /DSourceDir=$PWD /O$PWD\dist packaging\windows\installer.iss
      - name: Code signing of the installer (runs only when the SIGN_PFX_BASE64 secret exists)
        if: env.SIGN_ENABLED == 'true'
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          # OV/EV certificate as base64 PFX in repository secrets. Alternative for the French entity:
          # Azure Artifact Signing (azure/artifact-signing-action) instead of this step.
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          Get-ChildItem dist\*-setup.exe | ForEach-Object {
            & $signtool.FullName sign /f $pfx /p $env:SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Remove-Item $pfx
      - name: SBOM (CycloneDX)
        shell: pwsh
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --spec-version 1.5
          Copy-Item src\cli\*.cdx.json dist\sbom.cdx.json
      - name: Checksums
        shell: bash
        run: cd dist && sha256sum ./*.zip ./*.exe ./sbom.cdx.json > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.zip
            dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.v.outputs.version }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS
            dist/sbom.cdx.json
      - name: Attach to GitHub Release
        if: env.TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.zip dist/*.exe dist/SHA256SUMS dist/sbom.cdx.json --clobber
